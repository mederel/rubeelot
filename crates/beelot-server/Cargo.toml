[package]
name = "beelot-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Beelot's web server: tables, accounts and history, serving the frontend."

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
beelot-game = { path = "../beelot-game" }
dashmap = "6"
dotenvy = "0.15"
futures-util = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "uuid", "time", "migrate", "macros"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "request-id", "set-header", "limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
webauthn-rs-proto = "0.5"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
testcontainers-modules = { version = "0.15", features = ["mariadb"] }
tokio = { version = "1", features = ["test-util"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
