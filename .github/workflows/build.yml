name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs the workspace's tests with coverage instrumentation; llvm-cov skips
      # doctests, so they run on their own.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo test --workspace --doc
      - name: Summarise coverage
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          .github/scripts/coverage-summary.sh coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.md
      # A pull request from a fork gets a read-only token and cannot comment.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage.md
