name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs the workspace's tests with coverage instrumentation; llvm-cov skips
      # doctests, so they run on their own.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo test --workspace --doc
      - name: Summarise coverage
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          .github/scripts/coverage-summary.sh coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage.md
      # A pull request from a fork gets a read-only token and cannot comment.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage.md
