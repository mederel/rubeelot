name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Tells whether anything besides documentation changed. The check job is
  # skipped otherwise; a skipped job still satisfies the required check, which
  # paths-ignore would leave pending.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Documentation is Markdown and anything under docs/. When the diff
        # cannot be computed, or is empty, the code counts as changed.
        run: |
          if git diff --name-only "$BASE...$GITHUB_SHA" > changed.txt \
            && [ -s changed.txt ] \
            && ! grep -qvE '(^docs/|\.md$)' changed.txt; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
          cat changed.txt

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Runs the workspace's tests with coverage instrumentation; llvm-cov skips
      # doctests, so they run on their own.
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo test --workspace --doc
      - name: Summarise coverage
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          .github/scripts/coverage-summary.sh coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage.md
      # A pull request from a fork gets a read-only token and cannot comment.
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: coverage.md

  # On main, publishes what the checks accepted: the release build of the
  # server with its frontend, as a workflow artifact and a GitHub release.
  # Documentation-only pushes skip the checks and so release nothing.
  release:
    needs: [changes, check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two releases at once would compute the same version.
    concurrency:
      group: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(.github/scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.version != ''
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
      - if: steps.version.outputs.version != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.version.outputs.version != ''
        run: cargo build --release --locked -p beelot-server
      - name: Package
        if: steps.version.outputs.version != ''
        env:
          NAME: beelot-${{ steps.version.outputs.version }}-linux-x86_64
        run: |
          mkdir -p "dist/$NAME"
          cp target/release/beelot-server README.md "dist/$NAME/"
          cp -r crates/beelot-server/static "dist/$NAME/static"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
      - if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: beelot-${{ steps.version.outputs.version }}
          path: beelot-*.tar.gz
      - name: Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" beelot-*.tar.gz \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
